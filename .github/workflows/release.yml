name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: b12248
          path: vendor/llama.cpp
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend routing and scheduler
        run: npm run test:quick-start
      - name: Check production frontend
        run: npm run build
      - name: Check Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Lint Rust core
        if: runner.os == 'macOS'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Check Windows Rust core
        if: runner.os == 'Windows'
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --all-features
      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - name: Build bundled llama.cpp runtime
        run: |
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build vendor/llama.cpp/build --config Release --target llama-server --parallel 2
      - name: Stage llama-server sidecar
        run: node scripts/stage-llama-sidecar.mjs ${{ matrix.target }}
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "C-3PO Local Assistant ${{ github.ref_name }}"
          releaseBody: |
            # C-3PO Local Assistant 1.0

            Первый стабильный настольный выпуск для macOS Apple Silicon, macOS Intel и Windows x64.

            ## Главное

            - голосовой и текстовый интерфейс, фоновое локальное пробуждение на macOS;
            - локальные R2-D2, BB-8, K-2SO и BD-1 с автоматической маршрутизацией;
            - приложения, файлы, проекты, код, экран, почта и календарь;
            - отложенные задачи с прогрессом и системными уведомлениями;
            - проверка Rust, подтверждение и откат поддерживаемых изменений;
            - мониторинг памяти, журнал событий, светлая/тёмная тема и 10 языков.

            ## Установка

            Выберите DMG с `aarch64` для Apple Silicon, DMG с `x86_64` для Intel либо NSIS `.exe`
            для Windows. Сверьте файл по `SHA256SUMS.txt`. macOS-сборка имеет полную ad-hoc подпись;
            при первом запуске Gatekeeper может попросить разрешить C-3PO в настройках безопасности.

            Установщик включает `llama-server`. Рекомендуемые GGUF-модели (~8,5 ГБ) загружаются
            отдельно из панели только после подтверждения. История, полный голосовой образец, веса TTS,
            установленные модели и пользовательские данные в релиз не входят. Короткие встроенные
            реакции записаны автором проекта и не содержат голоса актёров или звука из фильмов.
          # Keep matrix artifacts private until every platform and signature check succeeds.
          releaseDraft: true
          prerelease: false
          args: "--target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json"
      - name: Verify macOS application signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          dmg_files=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#dmg_files[@]}" -eq 1

          mount_path="$RUNNER_TEMP/c3po-signature-${{ matrix.target }}"
          mkdir -p "$mount_path"
          hdiutil attach "${dmg_files[0]}" -readonly -nobrowse -mountpoint "$mount_path"
          trap 'hdiutil detach "$mount_path" || true' EXIT

          app_path="$mount_path/C-3PO.app"
          test -d "$app_path"
          test -f "$app_path/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=2 "$app_path"

  checksums:
    name: Publish SHA-256 checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download published installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release-assets
      - name: Create and upload checksum list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
