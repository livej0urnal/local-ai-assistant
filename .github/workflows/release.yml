name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: b12248
          path: vendor/llama.cpp
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build bundled llama.cpp runtime
        run: |
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build vendor/llama.cpp/build --config Release --target llama-server --parallel 2
      - name: Stage llama-server sidecar
        run: node scripts/stage-llama-sidecar.mjs ${{ matrix.target }}
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "C-3PO ${{ github.ref_name }}"
          releaseBody: |
            C-3PO Local Assistant for macOS Apple Silicon, macOS Intel and Windows x64.

            Highlights:
            - local R2-D2, BB-8, K-2SO and BD-1 model routing;
            - voice and text conversations with background wake-up;
            - system, file, code, mail, calendar and screen analysis;
            - scheduled tasks with progress and system notifications;
            - confirmation and rollback for supported changing actions.

            The installer includes the llama.cpp runtime. On first launch, the model panel can download
            the official recommended GGUF pack after explicit confirmation (~8.5 GB). Models can also be
            installed individually. Personal voice samples, conversation history and personal data are
            never included in release assets.
          releaseDraft: false
          prerelease: false
          args: "--target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json"

  checksums:
    name: Publish SHA-256 checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download published installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release-assets
      - name: Create and upload checksum list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
